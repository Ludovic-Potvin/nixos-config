# Colors
set -g @bg_default "#282828"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
set-window-option -g mode-keys vi
set -s escape-time 0

# switch panes using Alt-arrow without prefix
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

unbind x
unbind &
bind x run-shell "tmux kill-pane"
bind & run-shell "tmux kill-window"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g cursor-style bar

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#b8bb26'

# copy mode
setw -g mode-style 'fg=#282828 bg=#fe8019 bold'

# panes
set -g pane-border-style 'fg=#a89984'
set -g pane-active-border-style 'fg=#fe8019'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#ebdbb2'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=#282828 bg=#b8bb26'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#282828 bold bg=#b8bb26 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#fabd2f bg=#282828'
setw -g window-status-format ' #I #[fg=#d5c4a1]#W #[fg=#fabd2f]#F '

setw -g window-status-bell-style 'fg=yellow bg=#282828 bold'

# messages
set -g message-style 'fg=#282828 bg=#fb4934 bold'
